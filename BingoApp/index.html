<!DOCTYPE html>
<html>
<head>
    <title>Bingo Ultimate</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<h1>🎉 Bingo Ultimate</h1>

<div id="join">
    <input id="name" placeholder="Your name">
    <button onclick="join()">Join</button>
</div>

<div id="lobby"></div>

<div id="controls" style="display:none;">
    <select id="pattern">
        <option value="row">Row</option>
        <option value="column">Column</option>
        <option value="diagonal">Diagonal</option>
        <option value="x">X</option>
        <option value="corners">Corners</option>
        <option value="blackout">Blackout</option>
    </select>
    <button onclick="start()">Start</button>
    <button onclick="draw()">Draw</button>
    <button onclick="reset()">Reset</button>
</div>

<h2 id="number"></h2>
<h3 id="winner"></h3>

<div id="card"></div>

<div id="chat">
    <input id="msg" placeholder="Chat">
    <button onclick="send()">Send</button>
    <div id="log"></div>
</div>

<audio id="drawSound" src="/static/sounds/draw.mp3"></audio>
<audio id="bingoSound" src="/static/sounds/bingo.mp3"></audio>

<script>
const socket = io();

function join() {
    socket.emit("join", document.getElementById("name").value);
    document.getElementById("controls").style.display="block";
}

function start() {
    socket.emit("start", document.getElementById("pattern").value);
}

function draw() {
    socket.emit("draw");
}

function reset() {
    socket.emit("reset");
    location.reload();
}

function send() {
    socket.emit("chat", document.getElementById("msg").value);
    document.getElementById("msg").value="";
}

socket.on("lobby", data => {
    document.getElementById("lobby").innerText =
        "Players: " + data.players.join(", ") + " | Host: " + data.host;
});

socket.on("started", p => {
    document.getElementById("winner").innerText="Pattern: "+p;
});

socket.on("number", d => {
    document.getElementById("number").innerText="Number: "+d.number;
    document.getElementById("drawSound").play();
    if (d.winners.length) {
        document.getElementById("winner").innerText =
            "🎊 BINGO! " + d.winners.join(", ");
        document.getElementById("bingoSound").play();
    }
    socket.emit("get_card");
});

socket.on("card", card => {
    let h="<table><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>";
    for(let i=0;i<5;i++){
        h+="<tr>";
        for(let l of ["B","I","N","G","O"]){
            let v=card[l][i];
            h+=`<td class="${v==='X'?'marked':''}">${v}</td>`;
        }
        h+="</tr>";
    }
    h+="</table>";
    document.getElementById("card").innerHTML=h;
});

socket.on("chat", d => {
    document.getElementById("log").innerHTML +=
        `<div><b>${d.user}:</b> ${d.msg}</div>`;
});
</script>

</body>
</html>
