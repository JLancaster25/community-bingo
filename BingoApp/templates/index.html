<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/style.css">

<div class="container">
  <h2>🎱 Bingo</h2>

  <div id="callout"></div>

  <div class="card" id="card"></div>

  <button onclick="draw()">Draw Number</button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();

socket.on("card", card => {
  const grid = document.getElementById("card");
  grid.innerHTML = "";
  ["B","I","N","G","O"].forEach(l =>
    card[l].forEach(n => {
      const d = document.createElement("div");
      d.className = "cell" + (n === "X" ? " marked" : "");
      d.textContent = n;
      grid.appendChild(d);
    })
  );
});

socket.on("number", data => {
  document.getElementById("callout").textContent = data.call;
});
</script>
